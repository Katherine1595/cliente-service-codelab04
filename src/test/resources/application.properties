# ── Propiedades requeridas por el controlador ──────────────────────────────
api.version=v1
app.version=test

# ── JPA: crear y destruir esquema en cada ejecución de pruebas ─────────────
spring.jpa.hibernate.ddl-auto=create-drop

# ── Desactivar import.sql de producción ────────────────────────────────────
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ── Paginación: Page con totalElements, totalPages, etc. en la raíz ────────
spring.data.web.pageable.serialization-mode=direct
